spring.h2.console.enabled=true
spring.h2.console.path=/h2
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:~/spring-boot-h2-db;AUTO_SERVER=TRUE}
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
jwt.secret=${JWT_SECRET:[a-zA-Z0-9._]^+$Guidelines89797987forAlphabeticalArraNumeralsandOtherSymbo$}
reservering.uploadPath=${UPLOAD_PATH:uploads-local}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
