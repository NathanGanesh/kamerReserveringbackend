name: Spring Boot CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run static analysis, tests, coverage, and packaging
        run: ./gradlew checkstyleMain checkstyleTest test jacocoTestReport bootJar

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: spring-jacoco-coverage
          path: |
            build/reports/jacoco/test/html
            build/reports/jacoco/test/jacocoTestReport.xml

  prototype-smoke-deploy:
    runs-on: ubuntu-latest
    needs: build-test-package

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start prototype with Docker Compose
        run: docker compose up -d --build

      - name: Wait for health endpoint
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/health; then
              exit 0
            fi
            sleep 5
          done

          docker compose ps
          docker compose logs app
          exit 1

      - name: Run authenticated API smoke test
        run: |
          login_response=$(curl --fail --silent \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{"email":"pokemon@gmail.com","wachtwoord":"Pokemon!23"}' \
            http://localhost:8080/user/login)

          token=$(python3 -c 'import json, sys; print(json.load(sys.stdin)["token"])' <<< "$login_response")

          curl --fail --silent \
            --header "Authorization: Bearer ${token}" \
            http://localhost:8080/kamers

      - name: Stop prototype
        if: always()
        run: docker compose down -v
